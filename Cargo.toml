[[bin]]
name = "vikan"
path = "src/main.rs"

[package]
description = "Command line kanban TUI with vi-keybindings."
edition = "2024"
license = "MIT"
name = "vikan"
version = "0.1.0"

[dependencies]
crossterm = {version = "0.29.0" }
ratatui = {version = "0.29.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
